<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .summary-card {
            background-color: white;
            border: 1px solid #ddd;
            padding: 24px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-light bg-white border-bottom px-4 py-3">
    <a class="navbar-brand fw-bold" th:href="@{/games}">
        Video Game Storefront
    </a>

    <div>
        <a th:href="@{/cart}"
           class="btn btn-outline-secondary">
            Back to Cart
        </a>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="mb-4">Checkout</h2>

    <form th:action="@{/checkout/place-order}"
          th:object="${order}"
          method="post">

        <div class="row g-5">

            <div class="col-lg-7">

                <h4 class="mb-4">Customer Information</h4>

                <div class="mb-3">
                    <label class="form-label">
                        Full Name *
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{customerName}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Email *
                    </label>

                    <input type="email"
                           class="form-control"
                           th:field="*{customerEmail}"
                           required>
                </div>

                <h5 class="mt-4 mb-3">
                    Shipping Address
                </h5>

                <div class="mb-3">
                    <label class="form-label">
                        Address *
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{address}"
                           required>
                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            City *
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{city}"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            ZIP *
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{zip}"
                               required>
                    </div>

                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Phone
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{phone}">
                </div>

            </div>

            <div class="col-lg-5">

                <div class="summary-card">

                    <h4 class="mb-4">
                        Order Summary
                    </h4>

                    <div th:each="item : ${items}"
                         class="d-flex justify-content-between mb-3">

                        <div>
                            <strong th:text="${item.game.title}">
                                Game
                            </strong>

                            <div class="text-muted">
                                Qty:
                                <span th:text="${item.quantity}">
                                    1
                                </span>
                            </div>
                        </div>

                        <span th:text="'$' + ${item.lineTotal}">
                            $0.00
                        </span>

                    </div>

                    <hr>

                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal</span>
                        <strong th:text="'$' + ${subtotal}">
                            $0.00
                        </strong>
                    </div>

                    <div class="d-flex justify-content-between mb-2">
                        <span>Shipping</span>
                        <strong th:text="'$' + ${shipping}">
                            $9.99
                        </strong>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between fs-5 mb-4">
                        <strong>Total</strong>

                        <strong th:text="'$' + ${total}">
                            $0.00
                        </strong>
                    </div>

                    <button type="submit"
                            class="btn btn-dark btn-lg w-100">
                        Place Order
                    </button>

                </div>

            </div>

        </div>

    </form>

</div>

</body>
</html>
