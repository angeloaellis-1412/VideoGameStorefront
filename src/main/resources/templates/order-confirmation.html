<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmation</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .confirmation-card {
            max-width: 800px;
            margin: 0 auto;
        }

        .checkmark {
            font-size: 64px;
            color: #198754;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-light bg-white border-bottom px-4 py-3">
    <a class="navbar-brand fw-bold" th:href="@{/games}">
        Video Game Storefront
    </a>
</nav>

<div class="container mt-5">

    <div class="text-center mb-4">

        <div class="checkmark">
            ✓
        </div>

        <h1>Thank You for Your Order!</h1>

        <p class="text-muted">
            Your order was placed successfully.
        </p>

    </div>

    <div class="card confirmation-card">

        <div class="card-body p-4">

            <h4 class="mb-4">
                Order Summary
            </h4>

            <p>
                <strong>Order Number:</strong>
                <span th:text="${order.id}">
                    1
                </span>
            </p>

            <p>
                <strong>Customer:</strong>
                <span th:text="${order.customerName}">
                    Customer Name
                </span>
            </p>

            <p>
                <strong>Email:</strong>
                <span th:text="${order.customerEmail}">
                    customer@email.com
                </span>
            </p>

            <hr>

            <div th:each="item : ${order.items}"
                 class="d-flex justify-content-between mb-3">

                <div>
                    <strong th:text="${item.game.title}">
                        Game
                    </strong>

                    <div class="text-muted">
                        Qty:
                        <span th:text="${item.quantity}">
                            1
                        </span>
                    </div>
                </div>

                <span th:text="'$' + ${item.lineTotal}">
                    $0.00
                </span>

            </div>

            <hr>

            <div class="d-flex justify-content-between fs-5">
                <strong>Total</strong>

                <strong th:text="'$' + ${order.totalAmount}">
                    $0.00
                </strong>
            </div>

            <div class="text-center mt-4">

                <a th:href="@{/games}"
                   class="btn btn-dark">
                    Continue Shopping
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
