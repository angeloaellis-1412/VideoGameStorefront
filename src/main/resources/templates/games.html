<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Video Game Storefront</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .game-placeholder {
            height: 180px;
            background-color: #d9d9d9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-weight: bold;
        }

        .sidebar {
            background-color: white;
            border: 1px solid #ddd;
            padding: 20px;
        }

        .game-card {
            height: 100%;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-light bg-white border-bottom px-4 py-3">
    <a class="navbar-brand fw-bold" th:href="@{/games}">
        Video Game Storefront
    </a>

    <form class="d-flex" th:action="@{/games}" method="get">
        <input class="form-control me-2"
               type="search"
               name="search"
               placeholder="Search games"
               th:value="${search}">

        <button class="btn btn-outline-dark" type="submit">
            Search
        </button>
    </form>

    <div>
		<a th:href="@{/login}" class="btn btn-outline-secondary me-2">
		    Login
		</a>
		<a th:href="@{/cart}" class="btn btn-dark">
		    Cart
		</a>
    </div>
</nav>

<div class="container-fluid mt-4">
    <div class="row">

        <aside class="col-md-3 col-lg-2">
            <div class="sidebar">
				<form th:action="@{/games}" method="get">

				    <h5>Filters</h5>

				    <hr>

				    <h6>Platform</h6>

				    <div class="form-check">
				        <input class="form-check-input"
				               type="radio"
				               name="platform"
				               value="All"
				               th:checked="${platform == null or platform == 'All'}">
				        <label class="form-check-label">All</label>
				    </div>

				    <div class="form-check">
				        <input class="form-check-input"
				               type="radio"
				               name="platform"
				               value="PC"
				               th:checked="${platform == 'PC'}">
				        <label class="form-check-label">PC</label>
				    </div>

				    <div class="form-check">
				        <input class="form-check-input"
				               type="radio"
				               name="platform"
				               value="PlayStation"
				               th:checked="${platform == 'PlayStation'}">
				        <label class="form-check-label">PlayStation</label>
				    </div>

				    <div class="form-check">
				        <input class="form-check-input"
				               type="radio"
				               name="platform"
				               value="Xbox"
				               th:checked="${platform == 'Xbox'}">
				        <label class="form-check-label">Xbox</label>
				    </div>

				    <div class="form-check">
				        <input class="form-check-input"
				               type="radio"
				               name="platform"
				               value="Nintendo"
				               th:checked="${platform == 'Nintendo'}">
				        <label class="form-check-label">Nintendo</label>
				    </div>

				    <div class="form-check">
				        <input class="form-check-input"
				               type="radio"
				               name="platform"
				               value="Handheld"
				               th:checked="${platform == 'Handheld'}">
				        <label class="form-check-label">Handheld</label>
				    </div>

				    <hr>

					<h6>Genre</h6>

					<div class="form-check">
					    <input class="form-check-input"
					           type="checkbox"
					           name="genres"
					           value="Action"
					           th:checked="${genres != null and genres.contains('Action')}">
					    <label class="form-check-label">Action</label>
					</div>

					<div class="form-check">
					    <input class="form-check-input"
					           type="checkbox"
					           name="genres"
					           value="Adventure"
					           th:checked="${genres != null and genres.contains('Adventure')}">
					    <label class="form-check-label">Adventure</label>
					</div>

					<div class="form-check">
					    <input class="form-check-input"
					           type="checkbox"
					           name="genres"
					           value="RPG"
					           th:checked="${genres != null and genres.contains('RPG')}">
					    <label class="form-check-label">RPG</label>
					</div>

					<div class="form-check">
					    <input class="form-check-input"
					           type="checkbox"
					           name="genres"
					           value="Fighting"
					           th:checked="${genres != null and genres.contains('Fighting')}">
					    <label class="form-check-label">Fighting</label>
					</div>

					<div class="form-check">
					    <input class="form-check-input"
					           type="checkbox"
					           name="genres"
					           value="Shooter"
					           th:checked="${genres != null and genres.contains('Shooter')}">
					    <label class="form-check-label">Shooter</label>
					</div>

					<div class="form-check">
					    <input class="form-check-input"
					           type="checkbox"
					           name="genres"
					           value="Horror"
					           th:checked="${genres != null and genres.contains('Horror')}">
					    <label class="form-check-label">Horror</label>
					</div>

					<div class="form-check">
					    <input class="form-check-input"
					           type="checkbox"
					           name="genres"
					           value="Strategy"
					           th:checked="${genres != null and genres.contains('Strategy')}">
					    <label class="form-check-label">Strategy</label>
					</div>

					<div class="form-check">
					    <input class="form-check-input"
					           type="checkbox"
					           name="genres"
					           value="Sports"
					           th:checked="${genres != null and genres.contains('Sports')}">
					    <label class="form-check-label">Sports</label>
					</div>

					<div class="form-check">
					    <input class="form-check-input"
					           type="checkbox"
					           name="genres"
					           value="Racing"
					           th:checked="${genres != null and genres.contains('Racing')}">
					    <label class="form-check-label">Racing</label>
					</div>

					<div class="form-check">
					    <input class="form-check-input"
					           type="checkbox"
					           name="genres"
					           value="Simulation"
					           th:checked="${genres != null and genres.contains('Simulation')}">
					    <label class="form-check-label">Simulation</label>
					</div>

					<div class="form-check">
					    <input class="form-check-input"
					           type="checkbox"
					           name="genres"
					           value="Puzzle"
					           th:checked="${genres != null and genres.contains('Puzzle')}">
					    <label class="form-check-label">Puzzle</label>
					</div>

					<hr>

				    <h6>Price</h6>

				    <div class="form-check">
				        <input class="form-check-input"
				               type="checkbox"
				               name="priceRanges"
				               value="under20"
				               th:checked="${priceRanges != null and priceRanges.contains('under20')}">
				        <label class="form-check-label">Under $20</label>
				    </div>

				    <div class="form-check">
				        <input class="form-check-input"
				               type="checkbox"
				               name="priceRanges"
				               value="20to50"
				               th:checked="${priceRanges != null and priceRanges.contains('20to50')}">
				        <label class="form-check-label">$20 - $50</label>
				    </div>

				    <div class="form-check">
				        <input class="form-check-input"
				               type="checkbox"
				               name="priceRanges"
				               value="50to100"
				               th:checked="${priceRanges != null and priceRanges.contains('50to100')}">
				        <label class="form-check-label">$50 - $100</label>
				    </div>

				    <div class="form-check">
				        <input class="form-check-input"
				               type="checkbox"
				               name="priceRanges"
				               value="over100"
				               th:checked="${priceRanges != null and priceRanges.contains('over100')}">
				        <label class="form-check-label">Over $100</label>
				    </div>

				    <button class="btn btn-dark w-100 mt-3"
				            type="submit">
				        Apply Filters
				    </button>

				    <a th:href="@{/games}"
				       class="btn btn-outline-secondary w-100 mt-2">
				        Clear Filters
				    </a>

				</form>
            </div>
        </aside>

        <main class="col-md-9 col-lg-10">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Browse Games</h2>

                <select class="form-select w-auto">
                    <option>Sort by Newest</option>
                </select>
            </div>

            <div class="row g-4">

                <div class="col-md-6 col-lg-4"
                     th:each="game : ${games}">

                    <div class="card game-card">

                        <div class="game-placeholder">
                            Game Image
                        </div>

                        <div class="card-body">

                            <h5 class="card-title"
                                th:text="${game.title}">
                                Game Title
                            </h5>

                            <p class="text-muted mb-1"
                               th:text="${game.platform}">
                                Platform
                            </p>

                            <p class="fw-bold fs-5"
                               th:text="'$' + ${game.price}">
                                $59.99
                            </p>

                            <a class="btn btn-dark w-100"
                               th:href="@{/games/details(id=${game.id})}">
                                View Details
                            </a>

                        </div>
                    </div>

                </div>

            </div>

			<nav class="mt-5">
			    <ul class="pagination justify-content-center">
			        <li class="page-item active">
			            <span class="page-link">1</span>
			        </li>
			    </ul>
			</nav>

        </main>

    </div>
</div>

</body>
</html>
