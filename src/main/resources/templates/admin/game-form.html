<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Manage Game</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-light bg-white border-bottom px-4 py-3">

    <a class="navbar-brand fw-bold" th:href="@{/admin}">
        Video Game Storefront
    </a>

    <div>
        <a th:href="@{/admin}"
           class="btn btn-outline-secondary">
            Back to Dashboard
        </a>
    </div>

</nav>

<div class="container mt-5">

    <div class="card mx-auto" style="max-width: 800px;">

        <div class="card-body p-4">

            <h2 class="mb-4"
                th:text="${game.id == null ? 'Add Game' : 'Edit Game'}">
                Add Game
            </h2>

            <form th:action="@{/admin/save}"
                  th:object="${game}"
                  method="post">

                <input type="hidden"
                       th:field="*{id}">

                <div class="mb-3">

                    <label class="form-label">
                        Game Title *
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{title}"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Platform *
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{platform}"
                           list="platformOptions"
                           placeholder="Type or select a platform"
                           required>

                    <datalist id="platformOptions">

                        <option th:each="platform : ${platforms}"
                                th:value="${platform}">
                        </option>

                    </datalist>

                    <div class="form-text">
                        Select an existing platform or type a new one.
                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Genre *
                    </label>

                    <select class="form-select"
                            th:field="*{genre}"
                            required>

                        <option value="">
                            Select Genre
                        </option>

                        <option value="Action">Action</option>
                        <option value="Adventure">Adventure</option>
                        <option value="RPG">RPG</option>
                        <option value="Fighting">Fighting</option>
                        <option value="Shooter">Shooter</option>
                        <option value="Horror">Horror</option>
                        <option value="Strategy">Strategy</option>
                        <option value="Sports">Sports</option>
                        <option value="Racing">Racing</option>
                        <option value="Simulation">Simulation</option>
                        <option value="Puzzle">Puzzle</option>

                    </select>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Release Year *
                        </label>

                        <input type="number"
                               class="form-control"
                               th:field="*{releaseYear}"
                               min="1970"
                               max="2100"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Price *
                        </label>

                        <input type="number"
                               class="form-control"
                               th:field="*{price}"
                               min="0"
                               step="0.01"
                               required>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Stock Quantity *
                    </label>

                    <input type="number"
                           class="form-control"
                           th:field="*{stockQuantity}"
                           min="0"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea class="form-control"
                              th:field="*{description}"
                              rows="4">
                    </textarea>

                </div>

                <div class="form-check mb-4">

                    <input class="form-check-input"
                           type="checkbox"
                           th:field="*{active}">

                    <label class="form-check-label">
                        Active
                    </label>

                </div>

                <div class="d-flex justify-content-between">

                    <a th:href="@{/admin}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>

                    <button type="submit"
                            class="btn btn-dark">
                        Save Game
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>
