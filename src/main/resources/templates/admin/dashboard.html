<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .status-active {
            color: #198754;
            font-weight: bold;
        }

        .status-low {
            color: #b8860b;
            font-weight: bold;
        }

        .status-out {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-light bg-white border-bottom px-4 py-3">

    <a class="navbar-brand fw-bold" th:href="@{/admin}">
        Video Game Storefront
    </a>

    <div>
        <span class="me-3 fw-bold">Admin</span>

        <form th:action="@{/logout}"
              method="post"
              class="d-inline">

            <button type="submit"
                    class="btn btn-outline-secondary">
                Logout
            </button>

        </form>
    </div>

</nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Manage Inventory</h2>

        <a th:href="@{/admin/add}"
           class="btn btn-dark">
            + Add Game
        </a>

    </div>

    <div class="table-responsive">

        <table class="table table-bordered align-middle bg-white">

            <thead class="table-light">
                <tr>
                    <th>Game</th>
                    <th>Platform</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="game : ${games}">

                    <td th:text="${game.title}">
                        Game Title
                    </td>

                    <td th:text="${game.platform}">
                        Platform
                    </td>

                    <td th:text="'$' + ${game.price}">
                        $59.99
                    </td>

                    <td th:text="${game.stockQuantity}">
                        0
                    </td>

                    <td>

                        <span th:if="${game.stockQuantity == 0}"
                              class="status-out">
                            Out of Stock
                        </span>

                        <span th:if="${game.stockQuantity > 0 and game.stockQuantity <= 5}"
                              class="status-low">
                            Low Stock
                        </span>

                        <span th:if="${game.stockQuantity > 5}"
                              class="status-active">
                            Active
                        </span>

                    </td>

                    <td>

                        <a th:href="@{/admin/edit(id=${game.id})}"
                           class="btn btn-outline-primary btn-sm me-2">
                            Edit
                        </a>

                        <form th:action="@{/admin/delete}"
                              method="post"
                              class="d-inline">

                            <input type="hidden"
                                   name="id"
                                   th:value="${game.id}">

                            <button type="submit"
                                    class="btn btn-outline-danger btn-sm"
                                    onclick="return confirm('Delete this game?');">
                                Delete
                            </button>

                        </form>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
