<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Game Details</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .game-image {
            height: 420px;
            background-color: #d9d9d9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-weight: bold;
        }

        .thumbnail {
            height: 90px;
            background-color: #d9d9d9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 13px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-light bg-white border-bottom px-4 py-3">
    <a class="navbar-brand fw-bold" th:href="@{/games}">
        Video Game Storefront
    </a>

    <div>
        <a th:href="@{/games}" class="btn btn-outline-secondary me-2">
            Browse Games
        </a>

        <a href="#" class="btn btn-dark">
            Cart
        </a>
    </div>
</nav>

<div class="container mt-4">

    <div class="mb-4">
        <a th:href="@{/games}" class="text-decoration-none">
            Home
        </a>
        <span> &gt; Games &gt; </span>
        <span th:text="${game.title}">Game Title</span>
    </div>

    <div class="row g-5">

        <div class="col-md-6">

            <div class="game-image">
                Game Image
            </div>

            <div class="row g-2 mt-2">

                <div class="col-4">
                    <div class="thumbnail">
                        Image 1
                    </div>
                </div>

                <div class="col-4">
                    <div class="thumbnail">
                        Image 2
                    </div>
                </div>

                <div class="col-4">
                    <div class="thumbnail">
                        Image 3
                    </div>
                </div>

            </div>
        </div>

        <div class="col-md-6">

            <h1 th:text="${game.title}">
                Game Title
            </h1>

            <p class="fs-5 mt-4">
                <strong>Platform:</strong>
                <span th:text="${game.platform}">
                    Platform
                </span>
            </p>

            <p class="fs-5">
                <strong>Genre:</strong>
                <span th:text="${game.genre}">
                    Genre
                </span>
            </p>

            <p class="fs-5">
                <strong>Release Year:</strong>
                <span th:text="${game.releaseYear}">
                    2026
                </span>
            </p>

            <p class="fs-2 fw-bold mt-4"
               th:text="'$' + ${game.price}">
                $59.99
            </p>

            <hr>

            <h5>Description</h5>

            <p th:text="${game.description}">
                Game description.
            </p>

            <p class="mt-4">
                <strong>In Stock:</strong>
                <span th:text="${game.stockQuantity}">
                    0
                </span>
            </p>

            <form th:action="@{/cart/add}" method="post">
                <input type="hidden"
                       name="gameId"
                       th:value="${game.id}">

                <button type="submit"
                        class="btn btn-dark btn-lg w-100 mt-3"
                        th:disabled="${game.stockQuantity <= 0}">
                    Add to Cart
                </button>
            </form>

        </div>
    </div>

</div>

</body>
</html>
