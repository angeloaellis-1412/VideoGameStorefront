<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .game-thumb {
            width: 90px;
            height: 70px;
            background-color: #d9d9d9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-light bg-white border-bottom px-4 py-3">
    <a class="navbar-brand fw-bold" th:href="@{/games}">
        Video Game Storefront
    </a>

    <div>
        <a th:href="@{/games}" class="btn btn-outline-secondary me-2">
            Continue Shopping
        </a>
        <a th:href="@{/cart}" class="btn btn-dark">
            Cart
        </a>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="mb-4">Your Cart</h2>

    <div th:if="${#lists.isEmpty(items)}"
         class="alert alert-secondary">
        Your cart is empty.
    </div>

    <div th:if="${!#lists.isEmpty(items)}">

        <div class="table-responsive">
            <table class="table align-middle bg-white">

                <thead>
                    <tr>
                        <th>Game</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="item : ${items}">

                        <td>
                            <div class="d-flex align-items-center gap-3">

                                <div class="game-thumb">
                                    Game Image
                                </div>

                                <div>
                                    <strong th:text="${item.game.title}">
                                        Game Title
                                    </strong>

                                    <div class="text-muted"
                                         th:text="${item.game.platform}">
                                        Platform
                                    </div>
                                </div>

                            </div>
                        </td>

                        <td th:text="'$' + ${item.game.price}">
                            $59.99
                        </td>

                        <td>
                            <div class="d-flex align-items-center gap-2">

                                <form th:action="@{/cart/decrease}"
                                      method="post">
                                    <input type="hidden"
                                           name="gameId"
                                           th:value="${item.game.id}">

                                    <button type="submit"
                                            class="btn btn-outline-secondary btn-sm">
                                        -
                                    </button>
                                </form>

                                <span th:text="${item.quantity}">
                                    1
                                </span>

                                <form th:action="@{/cart/increase}"
                                      method="post">
                                    <input type="hidden"
                                           name="gameId"
                                           th:value="${item.game.id}">

                                    <button type="submit"
                                            class="btn btn-outline-secondary btn-sm">
                                        +
                                    </button>
                                </form>

                            </div>
                        </td>

                        <td th:text="'$' + ${item.lineTotal}">
                            $59.99
                        </td>

                        <td>
                            <form th:action="@{/cart/remove}"
                                  method="post">

                                <input type="hidden"
                                       name="gameId"
                                       th:value="${item.game.id}">

                                <button type="submit"
                                        class="btn btn-outline-danger btn-sm">
                                    Remove
                                </button>
                            </form>
                        </td>

                    </tr>

                </tbody>
            </table>
        </div>

        <div class="row justify-content-end mt-4">

            <div class="col-md-5 col-lg-4">

                <div class="card">
                    <div class="card-body">

                        <div class="d-flex justify-content-between mb-2">
                            <span>Subtotal</span>
                            <strong th:text="'$' + ${subtotal}">
                                $0.00
                            </strong>
                        </div>

                        <div class="d-flex justify-content-between mb-2">
                            <span>Shipping</span>
                            <strong th:text="'$' + ${shipping}">
                                $9.99
                            </strong>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between fs-5">
                            <strong>Total</strong>
                            <strong th:text="'$' + ${total}">
                                $0.00
                            </strong>
                        </div>

                    </div>
                </div>

            </div>

        </div>

        <div class="d-flex justify-content-between mt-4">

            <a th:href="@{/games}"
               class="btn btn-outline-secondary">
                Continue Shopping
            </a>

            <a th:href="@{/checkout}"
               class="btn btn-dark">
                Proceed to Checkout
            </a>

        </div>

    </div>

</div>

</body>
</html>
